                - paragraph [ref=f4e1086]: 砺儒云课堂致力于提供教学、学习与教学管理“一站式”服务，提升教师信息化教学能力和学生信息化学习能力，旨在建设成为高水平在线课程学习平台。砺儒云课堂以超融合基础架构作为技术架构，基于国际化开源教学平台Moodle，实现与多种校内信息化平台对接，实现利用教学大数据对学生进行跟踪反馈，具有功能插件多样、数据跟踪详细、开源式、扩展性能优异、维护简单等优点。
