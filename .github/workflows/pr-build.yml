name: PR Executable Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-executable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: fly_video_assignment_away-windows.exe
            artifact_path: dist/fly_video_assignment_away-windows.exe
          - os: macos-latest
            artifact_name: fly_video_assignment_away-macos
            artifact_path: dist/fly_video_assignment_away-macos
    runs-on: ${{ matrix.os }}
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      MISE_LOCKED: "1"
      MISE_ENV: "ci"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          add_shims_to_path: true
          cache_key: "mise-pr-executable-${{ runner.os }}-{{file_hash}}"

      - name: Build executable
        run: mise run executable:build

      - name: Upload executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 7
