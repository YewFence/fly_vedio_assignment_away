name: Action Versions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-version-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions-version:
    name: Check Action Versions
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      MISE_LOCKED: "1"
      MISE_ENV: "ci"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install_args: pinact
          add_shims_to_path: true
          cache_key: "mise-actioncheck-{{install_args_hash}}-{{file_hash}}"

      - name: Check Action versions
        env:
          PINACT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run actions:versions:check
