[project]
name = "fly-video-assignment-away"
version = "1.0.0"
description = "华南师范大学砺儒云 (Moodle) 视频自动观看工具"
requires-python = ">=3.13"
dependencies = [
    "playwright>=1.55.0",
    "python-dotenv>=1.2.1",
    "rich>=14.2.0",
]

[project.scripts]
fly-video = "fly_video_assignment_away.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
